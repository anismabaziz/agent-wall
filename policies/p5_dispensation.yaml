permissions:
  - id: Perm_InstallSoftware
    action: install_software
    constraint:
      is_managed_host: true
    provisions:
      - Ob_NotifyCISO

prohibitions: []

obligations:
  - id: Ob_NotifyCISO
    obliged_action: notify_ciso
    deadline_minutes: 60
    description: "Notify CISO of software installation"

dispensations:
  - id: Disp_ExemptCISO
    constraint:
      is_exempt_counterparty: true
    waives: Ob_NotifyCISO

rule_priorities: []

default_behavior: explicit_permit_implicit_prohibit
