# Flagship: financial-services policy.
#
# "High value" is a TYPE decided by the engine via subclass reasoning,
# not a flag the model asserts. Approval is a CREDENTIAL whose issuer must be
# in `credential_authorities`; the model cannot self-assert it.
ontology:
  - id: Transaction
    subClassOf: []
  - id: HighValueTransaction
    subClassOf: [Transaction]
  - id: CrossBorderTransfer
    subClassOf: [HighValueTransaction]

credential_authorities:
  - TreasuryAuthority

permissions:
  - id: Perm_ApprovedHighValue
    action: execute_payment
    constraint:
      matches_type: HighValueTransaction
      credential: TreasuryAuthority
    provisions:
      - Ob_FileCTR

prohibitions:
  - id: Proh_AutoHighValue
    action: execute_payment
    constraint:
      matches_type: HighValueTransaction

obligations:
  - id: Ob_FileCTR
    obliged_action: file_ctr
    deadline_minutes: 21600 # 15 days = 15 * 24 * 60
    description: "File CTR with FinCEN within 15 days"

dispensations:
  - id: Disp_ExemptCTR
    constraint:
      is_exempt_counterparty: true
    waives: Ob_FileCTR

rule_priorities:
  - id: Priority_ApprovalOverProh
    greater: Perm_ApprovedHighValue
    lesser: Proh_AutoHighValue

default_behavior: explicit_permit_implicit_prohibit